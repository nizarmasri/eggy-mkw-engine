# Eggy's iOS 26 work (branch ios26): the "baton" browser build, which runs the game without JSPI
# (EGGY.md, "iOS 26: the baton build"). Builds web/tests/baton - aurora and its libraries with
# -pthread, the pthread HostContext backend, aurora's main-thread split, the baton JS library -
# and runs it in headless Chromium with JSPI removed. No game data: the full game build happens
# in Eggy's private data repository, never here.
name: ios26
on:
  push:
    branches: [ios26]
  workflow_dispatch:
jobs:
  baton:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Emscripten, cached
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-6.0.12-${{ runner.os }}
      - name: Emscripten
        run: |
          if [ ! -x emsdk/emsdk ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk emsdk
            ./emsdk/emsdk install 6.0.12
            rm -rf emsdk/zips emsdk/downloads
          fi
          ./emsdk/emsdk activate 6.0.12 > /dev/null
          echo "EMSDK=$PWD/emsdk" >> "$GITHUB_ENV"
      - name: Ninja
        run: command -v ninja || sudo apt-get install -y ninja-build > /dev/null
      - name: The scripts parse
        run: for f in web/js/baton/*.js web/tests/baton/*.js web/tests/baton/*.mjs web/site/main.js; do node --check "$f"; done
      - name: Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm i --no-save --no-package-lock playwright@1.63.0 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Build and run the baton test (no JSPI, Chromium + SwiftShader WebGPU)
        run: web/tests/baton/run_baton_test.sh "$RUNNER_TEMP/baton" "$RUNNER_TEMP/baton-out/baton-test.log"
        env:
          JOBS: 4
      - name: Keep the log and the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baton-test
          path: ${{ runner.temp }}/baton-out/
          retention-days: 14
